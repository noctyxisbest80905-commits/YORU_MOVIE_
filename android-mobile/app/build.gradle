plugins { id 'com.android.application' }
def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
android {
    namespace 'com.moviebox.tv'
    compileSdk 35
    defaultConfig {
        applicationId 'com.obscura.yoru.mobile'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.5.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    testOptions { unitTests.all { systemProperty "yoru.safety.index", rootProject.file("../safety/adult_anime_index.json").absolutePath } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (releaseKeystorePath) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.test'; minifyEnabled false }
        release {
            minifyEnabled false
            if (releaseKeystorePath) { signingConfig signingConfigs.release }
        }
    }
    packaging { jniLibs { useLegacyPackaging = false } }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
