name: Build Yoru Android TV
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install native build helper
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build and test the tv APK
        run: bash android-tv/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Yoru-Android-TV-filtered
          path: android-tv/dist/Yoru-TV-filtered.apk
          if-no-files-found: error
